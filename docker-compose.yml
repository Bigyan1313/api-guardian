# Local Postgres for development. CI uses a service container instead (see
# .github/workflows/ci.yml), so this file is a developer convenience, not a
# dependency of the build.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api_guardian
      POSTGRES_PASSWORD: api_guardian
      POSTGRES_DB: api_guardian
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api_guardian -d api_guardian']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
