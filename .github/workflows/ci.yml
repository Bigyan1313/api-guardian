name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first; nothing here is worth
# paying for twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: api_guardian
          POSTGRES_PASSWORD: api_guardian
          POSTGRES_DB: api_guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_guardian -d api_guardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://api_guardian:api_guardian@localhost:5432/api_guardian

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: npm ci

      # The detector shells out to oasdiff and maps its rule identifiers by
      # name, so the version is pinned. Without it the detector tests skip
      # themselves, which would be a green build that tested nothing.
      - name: Install oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@v1.34.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: oasdiff is on PATH
        run: oasdiff --version

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Migrations are idempotent
        run: npm run db:migrate

      - name: Build the dashboard
        run: npm run build

      - name: Test
        run: npm test

      # The evaluation only admits a scenario whose tests fail before the fix
      # (SRS section 6.2). If the sample app ever passes against v2, that rule
      # has been broken and every repair rate measured afterwards is worthless,
      # so the build fails here rather than later and quietly.
      - name: The sample app must break against v2
        run: npm run check:v2-breaks

      # The schema tests skip themselves when DATABASE_URL is unset. That is
      # right on a laptop and wrong in CI, so fail the build if the database
      # went missing rather than reporting a green run that tested nothing.
      - name: The database really was there
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | grep -qx '8' || { echo "expected 8 tables in the public schema"; exit 1; }
